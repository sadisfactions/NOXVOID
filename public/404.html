<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 — страница не найдена</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <style>
    html, body { margin: 0; height: 100%; background: #08090B; color: #F4F4F4; font: 13px/1.6 Consolas, ui-monospace, Menlo, monospace; letter-spacing: .08em; }
    main { min-height: 100%; display: grid; place-content: center; gap: 14px; padding: 24px; text-align: center; }
    b { font: 400 clamp(72px, 22vw, 180px)/.9 Impact, "NX Display", "Arial Narrow Bold", sans-serif; color: #C6FF00; text-shadow: -3px 0 #B52CFF; }
    a { justify-self: center; padding: 12px 22px; background: #C6FF00; color: #08090B; font-weight: 700; text-decoration: none; text-transform: uppercase; letter-spacing: .16em; }
    a:hover, a:focus-visible { background: #d6ff3d; outline: 2px solid #C6FF00; outline-offset: 3px; }
    @font-face { font-family: "NX Display"; font-weight: 400; src: url("/assets/fonts/oswald-latin.woff2") format("woff2"); }
  </style>
</head>
<body>
  <main>
    <b>404</b>
    <p>Сигнал потерян: такой страницы нет.</p>
    <a href="/">На главную</a>
  </main>
</body>
</html>
